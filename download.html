<head>
  <title>Downloading...</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    /* Контейнер-центр для позиционирования */
    .spinner {
      position: relative;
      width: 100px;
      height: 100px;
      animation: spin 4s infinite;
    }

    .dot {
      background-image: radial-gradient(circle, #000 10px, transparent 10px);
      width: 25px;
      height: 25px;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -12.5px;
      margin-left: -12.5px;
      transform-origin: center center;
      opacity: 0; /* Изначально все выключены */
      animation: sn 3.5s infinite;
    }

    /* 
       Логика задержек:
       Появление идет вперед: d1 -> d2 -> d3 -> d4 -> d5 (шаг +0.1s)
       Исчезновение должно идти назад: d5 -> d4 -> d3 -> d2 -> d1.
       Для этого мы увеличиваем общую задержку, но "сжимаем" или сдвигаем фазы анимации.
       Идеальный баланс достигается следующими таймингами:
    */
    .d1 { transform: rotate(0deg) translate(60px); animation-delay: 0.1s; }
    .d2 { transform: rotate(45deg) translate(60px); animation-delay: 0.2s; }
    .d3 { transform: rotate(90deg) translate(60px); animation-delay: 0.3s; }
    .d4 { transform: rotate(135deg) translate(60px); animation-delay: 0.4s; }
    .d5 { transform: rotate(180deg) translate(60px); animation-delay: 0.5s; }

    /* Вращение всей конструкции */
    @keyframes spin {
      0% { rotate: -90deg; }
      100% { rotate: 630deg; }
    }

    /* 
       Таймлайн анимации (длительность 2 секунды):
       0% - 20%: Точка плавно загорается (с учетом delay они включаются по очереди 1->5)
       20% - 50%: Точка горит в полную силу
       50% - 70%: Точка плавно гаснет. 
       Благодаря delay в 0.4s у d5, её фаза угасания начнется раньше относительно общего цикла, 
       чем у d1 (у которой задержка 0s, то есть она держится включенной дольше всех).
    */
    @keyframes sn {
      0% { opacity: 0; }
      20%, 50% { opacity: 1; }
      70%, 100% { opacity: 0; }
    }
    
    h1{
      display: none;
      font-family: Arial, Helvetica, sans-serif;
    }
  </style>
</head>
<body>
  <div class="spinner">
    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
    <div class="dot d4"></div>
    <div class="dot d5"></div>
  </div>
  <h1>Download started.</h1>
</body>
<script>
let url = window.location.hash.slice(1);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function run() {
  console.log('Старт');
  await sleep(2000); // ждем 2 секунды (2000 миллисекунд)
  console.log('Прошло 2 секунды');
  window.location.href = url
}

run();
</script>
